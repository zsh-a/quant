# GPU deployment override — adds NVIDIA GPU access to backend services
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  api:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  celery_worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
