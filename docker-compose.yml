x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Shared backend build — api and celery_worker use the same image (built once)
# DEVICE: cu124 (GPU default) | cpu (PyTorch CPU) | none (no PyTorch, lightweight)
x-backend: &backend-build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      DEVICE: ${DEVICE:-cu124}
  image: quant-backend:latest

x-backend-env: &backend-env
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/1
  PYTHONUNBUFFERED: "1"
  QUANT_PROJECT_ROOT: /app
  QUANT_DATABASE__HOST: localhost
  QUANT_DATABASE__PORT: "8123"

x-backend-volumes: &backend-volumes
  - ./data:/app/data
  - ./config:/app/config
  - ./logs:/app/logs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    network_mode: host
    volumes:
      - ./db/data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    network_mode: host
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  api:
    <<: *backend-build
    container_name: quant_api
    network_mode: host
    volumes: *backend-volumes
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  celery_worker:
    <<: *backend-build
    container_name: quant_celery_worker
    network_mode: host
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4 --queues=backtest,default,automation
    volumes: *backend-volumes
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quant_frontend
    network_mode: host
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

volumes:
  redis_data:
  clickhouse_logs:
