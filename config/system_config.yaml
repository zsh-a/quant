# Quantitative Trading Platform Configuration

database:
  host: "localhost"
  port: 8123
  username: "default"
  password: ""

data_stream:
  chunk_size_months: null
  realtime:
    interval_seconds: 60
    data_source: "akshare"

broker:
  backtest:
    initial_cash: 1000000.0
    commission: 0.0001
    slippage: 0.001
  live:
    server_url: "http://localhost:11122"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

logging:
  level: "INFO"
  rotation: "100 MB"
  retention: "30 days"
  file:
    enabled: true
    path: "logs/quant.log"
  console:
    enabled: true
    colorize: true

alpha_lab:
  population_size: 64
  train_ratio: 0.5
  valid_ratio: 0.2
  test_ratio: 0.2
  llm_backend: "remote_api"
  max_ast_nodes: 24

bitget:
  base_url: "https://api.bitget.com"
  product_type: "USDT-FUTURES"
  default_symbols: ["BTCUSDT", "ETHUSDT"]
  request_timeout_seconds: 10

crypto_market:
  default_provider: "bitget"
  default_interval: "1m"
  default_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"]
  default_lookback_hours: 24
  full_history_start: "2020-01-01T00:00:00+00:00"
  state_file: "data/crypto_sync_state.json"
