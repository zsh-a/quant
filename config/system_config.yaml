# Quantitative Trading Platform Configuration

database:
  host: "localhost"
  port: 8123
  username: "default"
  password: ""

data_stream:
  chunk_size_months: null
  realtime:
    interval_seconds: 60
    data_source: "akshare"

broker:
  backtest:
    initial_cash: 1000000.0
    commission: 0.0001
    slippage: 0.001
  live:
    server_url: "http://localhost:11122"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

logging:
  level: "INFO"
  rotation: "100 MB"
  retention: "30 days"
  file:
    enabled: true
    path: "logs/quant.log"
  console:
    enabled: true
    colorize: true
