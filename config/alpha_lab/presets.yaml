# Alpha Lab search presets.
#
# These are returned by GET /alpha-lab/search-presets and consumed by the
# front-end SearchTab to populate the preset selector. Each preset maps a
# strategy mode + hyper-parameter bundle + budget cap bundle.
#
# Shape is mirrored by src/alpha/search/presets.py; editing here requires no
# code change. The API validates unknown keys are ignored.

presets:
  - key: quick
    label: 快速扫描
    hint: ~2 分钟出结果，小种群 + 1-2 轮；适合试水或因子草稿验证
    strategy: evolution
    params:
      popSize: 4
      offspring: 2
      gens: 2
      topK: 3
      nSplits: 3
      enumMax: 200
      enumTopK: 10
      neuralBatch: 2048
    budget:
      max_wall_time_sec: 180
      max_full_eval: 80

  - key: balanced
    label: 平衡探索 (推荐)
    hint: ~10 分钟，中等种群 + 3 轮进化；大多数研究场景的默认选择
    strategy: evolution
    params:
      popSize: 8
      offspring: 4
      gens: 3
      topK: 5
      nSplits: 5
      enumMax: 500
      enumTopK: 30
      neuralBatch: 4096
    budget:
      max_wall_time_sec: 900
      max_full_eval: 400

  - key: deep
    label: 深度探索
    hint: ~30 分钟以上，大种群 + 8 轮 + 更严 CPCV；用于最终选因子
    strategy: evolution
    params:
      popSize: 16
      offspring: 8
      gens: 8
      topK: 10
      nSplits: 7
      enumMax: 2000
      enumTopK: 60
      neuralBatch: 4096
    budget:
      max_wall_time_sec: 2400
      max_full_eval: 1500

  - key: mcts
    label: MCTS 精炼
    hint: 枚举+LLM+MCTS 三段式，适合有明确前辈因子想精修时使用
    strategy: mcts
    params:
      popSize: 8
      offspring: 4
      gens: 4
      topK: 5
      nSplits: 5
      enumMax: 500
      enumTopK: 30
      neuralBatch: 4096
    budget:
      max_wall_time_sec: 1200

  - key: neural
    label: Neural 大批量
    hint: Transformer + REINFORCE 纯神经网络搜索，适合数据量大的市场
    strategy: neural
    params:
      popSize: 4
      offspring: 4
      gens: 6
      topK: 8
      nSplits: 5
      enumMax: 0
      enumTopK: 0
      neuralBatch: 8192
    budget:
      max_wall_time_sec: 1800

# Auto-archive: how many top factors are written to Zoo after a search.
auto_archive:
  top_k: 5
  tag: auto_archive
