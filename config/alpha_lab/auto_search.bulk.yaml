window:
  lookback_minutes: 20160
  lag_minutes: 15
  step_minutes: 240

search:
  provider: bitget
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - LTCUSDT
    - LINKUSDT
    - AVAXUSDT
    - DOTUSDT
    - TRXUSDT
  interval: 15m
  min_quote_volume: 5000000
  blocked_utc_hours: []
  population_size: 48
  offspring_count: 96
  top_k: 16
  generations: 4
  novelty_threshold: 0.992
  n_splits: 4
  purge_window: 0
  embargo_window: 0
  persist: true
  run_name: auto_search_bulk
  seeds:
    - CSRank(ts_mean(close, 5) - close)
    - CSRank(ts_std(close, 10))
    - CSRank(volatility_n(close, 20))
    - cs_rank(oi_delta(open_interest, 1) - spread_ratio(bid_ask_spread, close))
    - cs_rank(adv_n(turnover, 10) - amihud(close, turnover, 5))
    - cs_rank(atr_n(high, low, close, 14) + funding_delta(funding_rate, 1))
  seed_zoo_limit: 24
  feedback_seed_count: 24
  feedback_objective: improve robustness and reduce turnover while preserving cross-sectional predictive power
  carryover_top_k: 12
  llm_backend: openai
  llm_model:
  llm_base_url:
  llm_api_key:

runtime:
  poll_interval_seconds: 1800
  sleep_after_success_seconds: 300
  max_cycles:
  continue_on_error: true
  failure_backoff_seconds: 60
  max_failure_backoff_seconds: 1800
  require_new_window: true
  state_path: data/alpha_lab/auto_search_bulk_state.json
  max_run_files: 400
  max_zoo_entries: 2000
