[project]
name = "quent"
version = "3.0.0"
description = "AI-Powered Quantitative Trading Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "akshare>=1.18.12",
    "baostock>=0.8.9",
    "clickhouse-connect>=0.10.0",
    "fastapi>=0.128.0",
    "gymnasium>=1.2.3",
    "loguru>=0.7.3",
    "mootdx>=0.11.7",
    "numpy>=2.1.3",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pyecharts>=2.0.9",
    "pyyaml>=6.0.3",
    "ta-lib>=0.6.8",
    "uvicorn>=0.40.0",
    
    # Phase 3 - Task Queue & Monitoring
    "celery>=5.3.4",
    "redis>=5.0.1",
    "flower>=2.0.1",
    "prometheus-client>=0.19.0",
    "msgpack>=1.0.7",
    
    # Additional dependencies
    "requests>=2.31.0",
    "websockets>=12.0",
    
    # Phase 4 - Optimization & Analysis
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    
    # Configuration
    "pydantic-settings>=2.0.0",
]

[tool.uv]
# UV configuration for faster dependency resolution
index-url = "https://pypi.org/simple"
