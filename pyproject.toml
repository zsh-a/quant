[project]
name = "quent"
version = "3.0.0"
description = "AI-Powered Quantitative Trading Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "akshare>=1.18.12",
    "baostock>=0.8.9",
    "clickhouse-connect>=0.10.0",
    "ccxt>=4.5.45",
    "fastapi>=0.128.0",
    "gymnasium>=1.2.3",
    "loguru>=0.7.3",
    "numpy>=2.1.3",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pyecharts>=2.0.9",
    "pyyaml>=6.0.3",
    "ta-lib>=0.6.8",
    "uvicorn[standard]>=0.34.0",
    # Phase 3 - Task Queue & Monitoring
    "celery>=5.3.4",
    "redis>=5.0.1",
    "flower>=2.0.1",
    "prometheus-client>=0.19.0",
    "msgpack>=1.0.7",
    # Additional dependencies
    "orjson>=3.10.0",
    "httpx>=0.28.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    # Phase 4 - Optimization & Analysis
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # Configuration
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "openai>=2.17.0",
    "langfuse>=2.0.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
gpu = ["torch>=2.0.0"]

[dependency-groups]
dev = [
    "mootdx>=0.11.7",
]

[tool.uv]
# UV configuration for faster dependency resolution
index-url = "https://pypi.org/simple"
# mootdx 0.11.7 (dev group) pins httpx<0.26 but the project needs >=0.28.
# Override forces resolution to use the newer httpx; mootdx's httpx usage is basic enough to be compatible.
override-dependencies = [
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".venv",
    ".pytest_cache",
    "db",
    "ui",
]
addopts = [
    "--ignore=src/tests",
    "--ignore=src/alpha_mining",
    "--ignore=test_e2e_integration.py",
    "--ignore=test_persistence.py",
    "--ignore=test_websocket.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "ui", "db", "data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
